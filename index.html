<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrammekeTV — Tools</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root,
    [data-theme="dark"] {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface-hover:#1c2128;
      --border:       #30363d;
      --text:         #c9d1d9;
      --muted:        #8b949e;
      --primary:      #58a6ff;
      --accent:       #f78166;
    }

    [data-theme="light"] {
      --bg:           #f9fafb;
      --surface:      #ffffff;
      --surface-hover:#f3f4f6;
      --border:       #e2e8f0;
      --text:         #111827;
      --muted:        #6b7280;
      --primary:      #4f46e5;
      --accent:       #ec4899;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      transition: background 150ms ease, color 150ms ease;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header span {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0;
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 6px;
      line-height: 1.5;
      transition: border-color 150ms ease, color 150ms ease;
    }

    .theme-toggle:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .page-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .tool-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 16px 20px;
      text-decoration: none;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      transition: background 150ms ease;
    }

    .tool-item:last-child {
      border-bottom: none;
    }

    .tool-item:hover {
      background: var(--surface-hover);
    }

    .tool-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .tool-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .tool-url {
      font-size: 12px;
      color: var(--muted);
    }

    .tool-arrow {
      color: var(--muted);
      font-size: 16px;
      flex-shrink: 0;
    }

    .tool-item:hover .tool-arrow {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <header>
    <span>BrammekeTV</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Switch to light mode">☀</button>
  </header>

  <main>
    <p class="page-title">Tools</p>
    <p class="page-sub">Hosted tools and utilities.</p>

    <div class="tool-list">

      <a class="tool-item" href="https://brammeketv.github.io/shipping-label-resizer/" target="_blank" rel="noopener noreferrer">
        <div class="tool-info">
          <span class="tool-name">Shipping Label Resizer</span>
          <span class="tool-url">brammeketv.github.io/shipping-label-resizer</span>
        </div>
        <span class="tool-arrow">→</span>
      </a>

      <a class="tool-item" href="https://brammeketv.github.io/winlossdatapkmn/" target="_blank" rel="noopener noreferrer">
        <div class="tool-info">
          <span class="tool-name">Win/Loss Data — Pokémon</span>
          <span class="tool-url">brammeketv.github.io/winlossdatapkmn</span>
        </div>
        <span class="tool-arrow">→</span>
      </a>

      <a class="tool-item" href="https://brammeketv.github.io/profit-monitor-pkmn/" target="_blank" rel="noopener noreferrer">
        <div class="tool-info">
          <span class="tool-name">Profit Monitor — Pokémon</span>
          <span class="tool-url">brammeketv.github.io/profit-monitor-pkmn</span>
        </div>
        <span class="tool-arrow">→</span>
      </a>

    </div>
  </main>

  <script>
    (function () {
      var html = document.documentElement;
      var btn  = document.getElementById('themeToggle');
      var stored;
      try { stored = localStorage.getItem('theme'); } catch (e) {}
      var theme = stored === 'light' ? 'light' : 'dark';

      function applyTheme(t) {
        html.setAttribute('data-theme', t);
        btn.textContent = t === 'dark' ? '☀' : '☾';
        btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }

      applyTheme(theme);

      btn.addEventListener('click', function () {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>

</body>
</html>
